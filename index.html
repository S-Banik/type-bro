<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Typing Practice Pro</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="container">

  <!-- SETUP -->
  <div id="setup">
    <h2>Typing Practice</h2>

    <textarea id="givenText" placeholder="Paste your paragraph..."></textarea>

    <div class="controls">
      <input type="number" id="timeValue" placeholder="Enter time" min="1">
      <select id="timeUnit">
        <option value="sec">Seconds</option>
        <option value="min">Minutes</option>
      </select>

      <button onclick="startTest()">Start Test</button>
    </div>
  </div>

  <!-- TEST -->
  <div id="test">
    <div class="passage" id="passage"></div>

    <textarea id="input" placeholder="Start typing..."></textarea>

    <div class="stats">
      <div>Accuracy: <span id="accuracy">100</span>%</div>
      <div>WPM: <span id="wpm">0</span></div>
      <div>Time: <span id="timer">0</span>s</div>
    </div>

    <button onclick="restartTest()">Restart</button>
  </div>

</div>

<script>
let currentText = "";
let startTime;
let timerStarted = false;
let timeLeft = 0;
let timerInterval;

let mistakes = 0;
let lastLength = 0;

const setupDiv = document.getElementById("setup");
const testDiv = document.getElementById("test");

const passageEl = document.getElementById("passage");
const inputEl = document.getElementById("input");

const accuracyEl = document.getElementById("accuracy");
const wpmEl = document.getElementById("wpm");
const timerEl = document.getElementById("timer");

/* START TEST */
function startTest() {
  const text = document.getElementById("givenText").value.trim();
  const timeVal = parseInt(document.getElementById("timeValue").value);
  const unit = document.getElementById("timeUnit").value;

  if (!text || !timeVal) {
    alert("Please enter text and time");
    return;
  }

  currentText = text;

  passageEl.innerHTML = currentText
    .split("")
    .map(char => `<span>${char}</span>`)
    .join("");

  timeLeft = unit === "min" ? timeVal * 60 : timeVal;
  timerEl.textContent = timeLeft;

  inputEl.value = "";
  inputEl.disabled = false;
  inputEl.focus();

  accuracyEl.textContent = "100";
  wpmEl.textContent = "0";

  mistakes = 0;
  lastLength = 0;
  timerStarted = false;

  setupDiv.style.display = "none";
  testDiv.style.display = "block";

  clearInterval(timerInterval);
}

/* TIMER */
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      inputEl.disabled = true;
      alert("Time's up!");
    }
  }, 1000);
}

/* TYPING */
inputEl.addEventListener("input", () => {
  const inputText = inputEl.value;
  const spans = passageEl.querySelectorAll("span");

  let correct = 0;

  if (!timerStarted && inputText.length === 1) {
    startTime = new Date();
    timerStarted = true;
    startTimer();
  }

  // mistake tracking
  if (inputText.length > lastLength) {
    const index = inputText.length - 1;
    if (inputText[index] !== currentText[index]) {
      mistakes++;
    }
  }

  lastLength = inputText.length;

  spans.forEach((span, index) => {
    const char = inputText[index];

    if (char == null) {
      span.classList.remove("correct", "wrong");
    } else if (char === span.textContent) {
      span.classList.add("correct");
      span.classList.remove("wrong");
      correct++;
    } else {
      span.classList.add("wrong");
      span.classList.remove("correct");
    }
  });

  /* ✅ FIXED AUTO SCROLL */
  // AUTO SCROLL (FINAL FIX)

const activeIndex = inputText.length;
const activeSpan = spans[activeIndex];

if (activeSpan) {
  const spanTop = activeSpan.offsetTop;
  const boxHeight = passageEl.clientHeight;

  // Store last scroll trigger position
  if (!window.lastScrollTop) {
    window.lastScrollTop = 0;
  }

  const minimumIndexBeforeScroll = 200;
  const nearEnd = activeIndex > spans.length - 20;

  // Only scroll when moving to a NEW line (not same line)
  if (
    activeIndex > minimumIndexBeforeScroll &&
    !nearEnd &&
    spanTop > boxHeight / 2 &&
    spanTop > window.lastScrollTop + 20   // 👈 key fix
  ) {
    passageEl.scrollTop += 25; // scroll one line
    window.lastScrollTop = spanTop; // update last line
  }
}

  // Accuracy
  let total = inputText.length + mistakes;
  let accuracy = total > 0 ? (correct / total) * 100 : 100;
  accuracyEl.textContent = accuracy.toFixed(2);

  // WPM
  let timeElapsed = (new Date() - startTime) / 1000 / 60;
  let words = inputText.length / 5;
  let wpm = timeElapsed > 0 ? words / timeElapsed : 0;
  wpmEl.textContent = Math.round(wpm);
});

/* RESTART */
function restartTest() {
  clearInterval(timerInterval);

  testDiv.style.display = "none";
  setupDiv.style.display = "block";

  document.getElementById("givenText").value = "";
  document.getElementById("timeValue").value = "";
}
</script>

</body>
</html>
